<!--
  Render Mermaid on the published site.

  Auto-rendering a ```mermaid fence is a github.com markdown feature, not a GitHub Pages one.
  Without this the book serves every diagram as source: the epoch timeline, the event graph and
  the atlas's per-era graphs. `pages-themes/minimal` includes `head-custom.html` in its <head>,
  which is the way in without overriding the theme's layout.

  **The markup to look for is `pre > code.language-mermaid`, with no wrapping div.** The first
  version of this file targeted `div.language-mermaid`, on the assumption that kramdown wraps a
  fence the way Rouge does. It does not: Rouge has no mermaid lexer, so kramdown falls through
  to a plain `<pre><code class="language-...">` and emits no wrapper at all. That selector
  matched nothing and the diagrams kept publishing as code blocks, which looks exactly like
  success from the repository. Verified against the live page this time, not assumed.

  Both shapes are handled anyway, so this keeps working if a mermaid lexer ever ships and Rouge
  starts wrapping. `textContent` rather than innerHTML for the same reason: the day highlighting
  turns on, the spans it injects must not reach the parser.

  If the CDN is unreachable the page degrades to what it shows today -- the diagram source,
  readable and plainly unrendered rather than blank.
-->
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

  const blocks = document.querySelectorAll("code.language-mermaid");
  blocks.forEach((code) => {
    const pre = document.createElement("pre");
    pre.className = "mermaid";
    pre.textContent = code.textContent;
    // The wrapper if Rouge made one, the <pre> otherwise.
    (code.closest("div.language-mermaid") || code.closest("pre") || code).replaceWith(pre);
  });

  if (blocks.length) {
    mermaid.initialize({
      startOnLoad: false,
      // The book is a light page; `neutral` sits closer to it than the default.
      theme: "neutral",
      securityLevel: "strict",
    });
    await mermaid.run();
  }
</script>
