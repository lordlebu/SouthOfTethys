title: "South of Tethys - Digital Book"
description: "A procedurally evolving fantasy world created through collaborative storytelling"
baseurl: "/SouthOfTethys"
url: "https://lordlebu.github.io"

# Theme
remote_theme: pages-themes/minimal@v0.2.0
plugins:
- jekyll-remote-theme

# No `header_pages` here. It is a minima setting, and this site uses
# pages-themes/minimal, whose sidebar renders the title, the description and a link to the
# repository -- and nothing else. Listing pages under it configured a nav that never existed:
# the atlas and the timeline were published, reachable, and linked from nowhere.
# The book's pages link each other from their own content instead. See utils/book_nav.py.

# Markdown processing
markdown: kramdown
highlighter: rouge

# SEO
author: "South of Tethys Contributors"
social:
  github: lordlebu/SouthOfTethys

# Collections
collections:
  docs:
    output: true
    permalink: /:collection/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"