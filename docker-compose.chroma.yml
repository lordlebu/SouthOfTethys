services:
  vidur:
    build:
      context: .
      dockerfile: vidur_portal/Dockerfile
    volumes:
      - ./:/app:cached
      - chroma_data:/app/storage/chroma
    ports:
      - "8501:8501"
    environment:
      - CHROMA_PERSIST_DIR=/app/storage/chroma
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
    # Wait for indexing to finish, otherwise the portal opens on an empty volume.
    depends_on:
      chroma-service:
        condition: service_completed_successfully

  chroma-service:
    build:
      context: ./services/chroma
      dockerfile: Dockerfile
    volumes:
      - ./:/app/repo:cached
      - chroma_data:/data/chroma
    environment:
      - REPO_DIR=/app/repo
      - CHROMA_PERSIST_DIR=/data/chroma
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
    command: ["python", "index_chroma_service.py"]

volumes:
  chroma_data:
    driver: local
