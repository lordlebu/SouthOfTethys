# The one workflow that publishes the book.
#
# `ci.yml` used to deploy Pages as well, and the two raced for the same `github-pages`
# environment -- but they did not publish the same thing. This one runs a real Jekyll build over
# `docs/`. That one called `upload-pages-artifact` on the directory with no build at all, so it
# served raw markdown and ignored `_config.yml`, the nav and `_includes/` entirely. Whichever
# finished last decided whether the live site was a built site or a folder of `.md` files.
#
# That is the deeper half of why the published book stayed stale for months while CI regenerated
# it on every push. `ci.yml` no longer deploys; `docs/` is tracked, so what is committed is what
# gets built.
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  push:
    branches: ["main"]
    paths:
      - 'docs/**'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
