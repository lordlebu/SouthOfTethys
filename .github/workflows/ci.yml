name: CI

on:
  push:
    branches:
      - main
      - feature/*
      - book-publish
    paths:
      - '.github/workflows/ci.yml'
      - '.gitignore'
      - 'utils/**'
      - 'Dockerfile'
      - 'database/**'
      - 'CONTEXT.md'
      - 'DESIGN.md'
      - 'requirements.txt'

  pull_request:
    branches:
      - main
      - feature/*
    paths:
      - '.github/workflows/ci.yml'
      - '.gitignore'
      - 'utils/**'
      - 'Dockerfile'
      - 'database/**'
      - 'CONTEXT.md'
      - 'DESIGN.md'
      - 'requirements.txt'

  workflow_dispatch:
    inputs:
      publish_book:
        description: 'Publish complete book artifacts'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Docker image
        run: docker build -t southoftethys .

      - name: Run validation and artifact generation
        run: |
          python utils/lint_story.py
          python utils/generate_timeline_mermaid.py
          python utils/generate_timeline.py
          python utils/generate_atlas.py
          python utils/evolve_species.py
          flake8 utils/ || true

  generate-artifacts:
    runs-on: ubuntu-latest
    needs: lint-and-validate
    outputs:
      artifacts-generated: ${{ steps.check-artifacts.outputs.generated }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate artifacts from database/
        run: |
          python utils/generate_timeline_mermaid.py
          python utils/generate_timeline.py
          python utils/generate_atlas.py
          python utils/evolve_species.py

      - name: Check artifacts generated
        id: check-artifacts
        run: |
          echo "generated=true" >> $GITHUB_OUTPUT
          ls -la docs/ || true

      - name: Upload timeline summary artifact
        uses: actions/upload-artifact@v7
        with:
          name: timeline_summary
          path: docs/index.md
          if-no-files-found: warn

      - name: Upload timeline mermaid artifact
        uses: actions/upload-artifact@v7
        with:
          name: timeline_mermaid
          path: docs/timeline_mermaid.md
          if-no-files-found: warn

      - name: Upload full timeline artifact
        uses: actions/upload-artifact@v7
        with:
          name: full_timeline
          path: docs/timeline.json
          if-no-files-found: warn

  deploy-docs:
    runs-on: ubuntu-latest
    needs: generate-artifacts
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/book-publish' || github.event.inputs.publish_book == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Straight into docs/. There used to be a timeline/ build directory copied across
      # here, and the copy is what went stale -- docs/ served another project's story for
      # months while the generator produced real canon. One location cannot drift from itself.
      - name: Generate all artifacts for docs
        run: |
          python utils/generate_timeline_mermaid.py
          python utils/generate_timeline.py
          python utils/generate_atlas.py

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install flake8 ruff

      - name: Run code quality checks
        run: |
          python -m flake8 utils/ || true
          # Pre-existing style debt (BLE001/PERF402/E501) — warn only until cleanup pass
          python -m ruff check utils/ || true
