name: CI

on:
  push:
    branches:
      - main
      - feature/*
      - book-publish
    paths:
      - '.github/workflows/ci.yml'
      - '.gitignore'
      - 'utils/**'
      - 'Dockerfile'
      - 'database/**'
      - 'CONTEXT.md'
      - 'DESIGN.md'
      - 'requirements.txt'

  pull_request:
    branches:
      - main
      - feature/*
    paths:
      - '.github/workflows/ci.yml'
      - '.gitignore'
      - 'utils/**'
      - 'Dockerfile'
      - 'database/**'
      - 'CONTEXT.md'
      - 'DESIGN.md'
      - 'requirements.txt'

  workflow_dispatch:
    inputs:
      publish_book:
        description: 'Publish complete book artifacts'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Docker image
        run: docker build -t southoftethys .

      - name: Run validation and artifact generation
        run: |
          python utils/lint_story.py
          python utils/generate_timeline_mermaid.py
          python utils/generate_timeline.py
          python utils/generate_atlas.py
          python utils/generate_memory_map.py
          python utils/generate_books.py
          python utils/evolve_species.py
          flake8 utils/ || true

  generate-artifacts:
    runs-on: ubuntu-latest
    needs: lint-and-validate
    outputs:
      artifacts-generated: ${{ steps.check-artifacts.outputs.generated }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate artifacts from database/
        run: |
          python utils/generate_timeline_mermaid.py
          python utils/generate_timeline.py
          python utils/generate_atlas.py
          python utils/generate_memory_map.py
          python utils/generate_books.py
          python utils/evolve_species.py

      - name: Check artifacts generated
        id: check-artifacts
        run: |
          echo "generated=true" >> $GITHUB_OUTPUT
          ls -la docs/ || true

      - name: Upload timeline summary artifact
        uses: actions/upload-artifact@v7
        with:
          name: timeline_summary
          path: docs/index.md
          if-no-files-found: warn

      - name: Upload timeline mermaid artifact
        uses: actions/upload-artifact@v7
        with:
          name: timeline_mermaid
          path: docs/timeline_mermaid.md
          if-no-files-found: warn

      - name: Upload full timeline artifact
        uses: actions/upload-artifact@v7
        with:
          name: full_timeline
          path: docs/timeline.json
          if-no-files-found: warn
