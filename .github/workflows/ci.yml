name: CI

on:
  push:
    branches:
      - main
      - feature/*
      - book-publish
    paths:
      - '.github/workflows/ci.yml'
      - '.gitignore'
      - 'utils/**'
      - 'Dockerfile'
      - 'cartography/**'
      - 'database/**'
      - 'CONTEXT.md'
      - 'DESIGN.md'
      - 'requirements.txt'

  pull_request:
    branches:
      - main
      - feature/*
    paths:
      - '.github/workflows/ci.yml'
      - '.gitignore'
      - 'utils/**'
      - 'Dockerfile'
      - 'cartography/**'
      - 'database/**'
      - 'CONTEXT.md'
      - 'DESIGN.md'
      - 'requirements.txt'

  workflow_dispatch:
    inputs:
      publish_book:
        description: 'Publish complete book artifacts'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Docker image
        run: docker build -t southoftethys .

      - name: Run validation and artifact generation
        run: |
          python utils/lint_story.py
          python utils/generate_timeline_mermaid.py
          python utils/generate_timeline.py
          python utils/generate_map.py
          python utils/evolve_species.py
          flake8 utils/ || true

  generate-artifacts:
    runs-on: ubuntu-latest
    needs: lint-and-validate
    outputs:
      artifacts-generated: ${{ steps.check-artifacts.outputs.generated }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate artifacts from database/
        run: |
          python utils/generate_timeline_mermaid.py
          python utils/generate_timeline.py
          python utils/generate_map.py
          python utils/evolve_species.py

      - name: Check artifacts generated
        id: check-artifacts
        run: |
          echo "generated=true" >> $GITHUB_OUTPUT
          ls -la timeline/ || true
          ls -la cartography/ || true

      - name: Upload timeline summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: timeline_summary
          path: timeline/timeline_summary.md
          if-no-files-found: warn

      - name: Upload timeline mermaid artifact
        uses: actions/upload-artifact@v4
        with:
          name: timeline_mermaid
          path: timeline/timeline_mermaid.md
          if-no-files-found: warn

      - name: Upload full timeline artifact
        uses: actions/upload-artifact@v4
        with:
          name: full_timeline
          path: timeline/timeline.json
          if-no-files-found: warn

      - name: Upload interactive map artifact
        uses: actions/upload-artifact@v4
        with:
          name: interactive_map
          path: cartography/interactive_map.html
          if-no-files-found: warn

      - name: Upload overworld map artifact
        uses: actions/upload-artifact@v4
        with:
          name: overworld_map
          path: cartography/overworld.json
          if-no-files-found: warn

      - name: Upload regions geojson artifact
        uses: actions/upload-artifact@v4
        with:
          name: regions_geojson
          path: cartography/regions.geojson
          if-no-files-found: warn

  deploy-docs:
    runs-on: ubuntu-latest
    needs: generate-artifacts
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/book-publish' || github.event.inputs.publish_book == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate all artifacts for docs
        run: |
          python utils/generate_timeline_mermaid.py
          python utils/generate_timeline.py
          python utils/generate_map.py

      - name: Prepare docs directory
        run: |
          mkdir -p docs
          cp timeline/timeline_summary.md docs/index.md || true
          cp timeline/timeline_mermaid.md docs/timeline_mermaid.md || true
          cp cartography/interactive_map.html docs/interactive_map.html || true
          cp cartography/overworld.json docs/overworld.json || true
          cp cartography/regions.geojson docs/regions.geojson || true
          cp timeline/timeline.json docs/timeline.json || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install flake8 ruff

      - name: Run code quality checks
        run: |
          python -m flake8 utils/ || true
          python -m ruff check utils/
