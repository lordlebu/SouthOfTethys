name: Validate Story World

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    # This is the check `main` requires, so a PyPI blip here blocks every merge. pip retries itself
    # with these; see the same block in deploy-canon-service.yml for the run that prompted it.
    env:
      PIP_RETRIES: '5'
      PIP_TIMEOUT: '60'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linting (database/ consistency)
        run: python utils/lint_story.py

      # The lore layer is about to grow a great deal and almost none of it is meant to ship.
      # This proves it cannot reach the game by accident: every folder in database/ is
      # explicitly exported or explicitly withheld, and the bundle the exporter would write
      # still hashes to what canon pinned. A lore edit that moves a byte of the game's data
      # fails here, with the file named, rather than turning up in somebody's save later.
      - name: Check the export boundary (can lore reach the game?)
        run: python utils/check_export_boundary.py

      # lint_story proves the references resolve. This proves a player can actually get
      # there: it starts from nothing and does whatever becomes possible until nothing
      # more does, so a ladder that depends on itself fails here rather than shipping.
      - name: Check playability (can the world be played through?)
        run: python utils/check_playability.py

      - name: Regenerate timeline from database/events
        run: python utils/generate_timeline.py

      - name: Upload merged timeline artifact
        uses: actions/upload-artifact@v7
        with:
          name: full_timeline
          path: docs/timeline.json
          if-no-files-found: warn
